[project]
name = "connectris-pipeline"
version = "0.1.0"
description = "Offline puzzle generation pipeline for Connectris (DESIGN.md phase 2)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "typer>=0.15", "google-genai>=2.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "ty==0.0.32"]

[project.scripts]
connectris-pipeline = "connectris_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B",
  # ANN is the one that makes the type checker bite: without it a signature can go
  # untyped and every call through it silently returns Unknown.
  "ANN",
  # Zero findings when added — free ratchets rather than cleanup work.
  "ASYNC", "DTZ", "PTH", "N", "ERA",
  "C4", "SIM", "PERF", "RET", "PIE", "RSE",
  "LOG", "G",
  # log.error inside an except loses the traceback on exactly the paths that swallow a
  # failure.
  "TRY400",
  "RUF", "S",
]
ignore = [
  # Reproducible non-cryptographic RNG is the design here: seeds are what make a run
  # repeatable (solve.py, pipeline.py).
  "S311",
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test, and a test's return type is never interesting.
# Asserts are the point of a test; a test's return type is never interesting; and
# annotating **kwargs on a scripted double as `object` defeats inference at the call site.
"tests/*" = ["S101", "ANN201", "ANN001", "ANN003", "ANN202", "ANN204"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
