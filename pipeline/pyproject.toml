[project]
name = "connectris-pipeline"
version = "0.1.0"
description = "Offline puzzle generation pipeline for Connectris (DESIGN.md phase 2)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "typer>=0.15", "google-genai>=2.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
connectris-pipeline = "connectris_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
