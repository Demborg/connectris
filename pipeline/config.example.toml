# Everything here is optional; absent keys keep the defaults in config.py.
# Copy to config.toml and pass with --config.

attempts_per_solver = 3
concurrency = 8
max_revisions = 1
max_retries = 3

# Empty string turns embeddings off and falls back to lexical similarity, which is a
# floor on legibility rather than a measurement of it.
embedding_model = "gemini-embedding-2"

# Gemini 3 models take `thinking_level` = "low" | "medium" | "high". ("minimal" exists in
# the API but 3.8 Flash rejects it.) Gemini 2.5 models take `thinking_budget` in tokens,
# 0 to switch thinking off. Set one or the other, never both.
#
# `temperature` is deliberately absent everywhere below. Google's Gemini 3 guidance is to
# leave it at its default of 1.0 — lower values loop and degrade on reasoning tasks — so
# attempt-to-attempt variety comes from `seed` instead. Set it only on a 2.5-family model.

[proposer]
name = "gemini-3.8-flash"
thinking_level = "high"

[red_team]
name = "gemini-3.8-flash"
thinking_level = "high"

[grader]
name = "gemini-3.8-flash"
thinking_level = "high"

# The ensemble is deliberately weak and deliberately mixed — two generations, two tiers.
# Mixing model families is a feature: it stops puzzle quality overfitting to one model's
# blind spots.
[[solvers]]
name = "gemini-3.5-flash-lite"
thinking_level = "low"

[[solvers]]
name = "gemini-3.1-flash-lite"
thinking_level = "low"

[[solvers]]
name = "gemini-2.5-flash-lite"
thinking_budget = 0

[thresholds]
min_mean_recovery = 0.15
max_mean_recovery = 0.80
max_full_solve_rate = 0.50
min_legibility = 0.45
max_ambiguous_words = 0
min_fairness = 4
min_elegance = 3
