# Everything here is optional; absent keys keep the defaults in config.py.
# Copy to config.toml and pass with --config.

# In-flight model calls. Boards are generated one at a time, so this now only parallelises
# the solver's attempts within a candidate; there is nothing left for a larger number to
# overlap.
concurrency = 8
max_retries = 3

# One deliberately weak model, three attempts. Three models were redundant (they
# correlated 0.71-0.85); one attempt was too few (recovery quantises to steps of 0.2 and
# the gate reading it stops being a band).
attempts = 3

# How many categories to invent when the pool cannot cover a batch. Bulk is fine here —
# a category is a one-line idea, unlike a board.
invent_batch = 40

# Gemini 3 models take `thinking_level` = "low" | "medium" | "high". ("minimal" exists in
# the API but 3.8 Flash rejects it.) Gemini 2.5 models take `thinking_budget` in tokens,
# 0 to switch thinking off. Set one or the other, never both.
#
# `temperature` is deliberately absent everywhere below. Google's Gemini 3 guidance is to
# leave it at its default of 1.0 — lower values loop and degrade on reasoning tasks — so
# attempt-to-attempt variety comes from `seed` instead. Set it only on a 2.5-family model.

[proposer]
name = "gemini-3.8-flash"
thinking_level = "high"

[red_team]
name = "gemini-3.8-flash"
thinking_level = "high"

[grader]
name = "gemini-3.8-flash"
thinking_level = "high"

[solver]
name = "gemini-3.1-flash-lite"
thinking_level = "low"

# Writes the note a player reads under a solved row. Runs once per accepted board, so it
# is the cheapest stage there is — and it still gets the strong model, because the output
# is shipped prose stating who Charles Boycott was.
[glosser]
name = "gemini-3.8-flash"
thinking_level = "low"

# Three gates. The other four were measured across a real run: none of them ever
# changed a verdict, because the grader had already decided. The evidence they were
# gating on still reaches the grader as prose.
[thresholds]
max_mean_recovery = 0.80
min_fairness = 4
min_elegance = 3

# --- on the two knobs that decide the bill -------------------------------------------
#
# `--count` is a ceiling on proposals, not a quantity: the night stops at the first board
# accepted. At the measured 55% acceptance a ceiling of 5 costs 1.78 candidates on average
# and lands a board on 98% of nights, where 3 costs 1.65 for 91%. Thirteen extra points of
# reliability for two cents; raise it before you lower it.
#
# `[proposer] thinking_level` is the other one, and early exit changed the arithmetic on
# it. Cost per shipped board is (1 / acceptance) x cost per candidate, so acceptance
# multiplies where per-candidate cost only adds. `medium` measured 23% cheaper per
# candidate at n=3 ($0.182 -> $0.157), which is only a saving while acceptance holds above
# **47.4%**; below that it costs more per board than `high` does. Nobody has measured
# acceptance at `medium` on a sample that could tell 55% from 47%, so the default stays
# `high` and the experiment is still worth buying — see docs/generation-cost.md.
