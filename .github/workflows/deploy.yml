name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# No key file anywhere: GitHub's OIDC token is exchanged for a short-lived Google one,
# and only this repository is allowed to make that exchange.
permissions:
  contents: read
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: cloud-run
  cancel-in-progress: false

env:
  PROJECT: connectris-507519
  REGION: europe-north1
  SERVICE: connectris

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          project_id: connectris-507519
          workload_identity_provider: projects/214765692756/locations/global/workloadIdentityPools/github/providers/demborg-connectris
          service_account: connectris-deploy@connectris-507519.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Built by Cloud Build from the Dockerfile, so the image is produced the same way
      # whoever deploys it — a workflow or a laptop running `gcloud run deploy --source`.
      - id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region="$REGION" \
            --project="$PROJECT" \
            --service-account=connectris-run@connectris-507519.iam.gserviceaccount.com \
            --set-env-vars=GOOGLE_CLOUD_PROJECT="$PROJECT" \
            --min-instances=0 --max-instances=3 --concurrency=80 \
            --memory=512Mi --cpu=1 --cpu-boost \
            --allow-unauthenticated \
            --quiet
          echo "url=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      # `-L`, because the front door is a redirect now: a visitor with no name yet is sent
      # to /hello, so asserting a literal 200 on `/` was asserting the absence of the sign-in
      # gate. It went red the moment accounts landed and stayed red, which is the worst
      # thing a smoke test can do — a deploy signal nobody believes is not a signal.
      #
      # Following the chain is also the better check. It proves the app booted, routed, and
      # rendered a page, whichever page that is, and it keeps proving it if the gate moves
      # or goes away. `--max-time` so a hung revision fails here rather than at the job
      # timeout, and `-f` so a 5xx after the redirect cannot pass as "served something".
      - name: Check the deployed revision answers
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          code=$(curl -sfL --max-time 30 -o /dev/null -w '%{http_code}' "$URL/") || {
            echo "$URL/ did not answer (curl exit $?, last status ${code:-none})"
            exit 1
          }
          test "$code" = "200" || { echo "front door came back $code"; exit 1; }
          echo "$URL is serving"
