name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      # The pipeline is offline here: the mock provider plays every model role, so this
      # needs no credentials and makes no network calls.
      - name: Lint
        run: uv run --with ruff ruff check . && uv run --with ruff ruff format --check .

      - name: Test
        run: uv run --extra dev --python 3.12 pytest -q

      - name: Puzzle rules still agree with the game's
        run: uv run --python 3.12 python -m connectris_pipeline.cli check
