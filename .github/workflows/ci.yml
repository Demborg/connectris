name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The store contract, run against Firestore rather than against memory and files. A
  # port whose adapters disagree is a port that is lying, and only the emulator can say
  # whether the real one agrees. Separate job because it needs a JVM the rest does not.
  stores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud components install cloud-firestore-emulator --quiet

      - run: pnpm install --frozen-lockfile

      - name: Firestore adapters answer to the same contract
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8080 &
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ >/dev/null || { echo "emulator never came up"; exit 1; }
          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 pnpm test

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Offline: a scripted double stands in for the model, so this needs no credentials
      # and makes no network calls. --locked so the tools cannot drift with the calendar.
      - name: Lint
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .

      - name: Type check
        run: uv run --locked --extra dev ty check .

      - name: Test
        run: uv run --locked --extra dev pytest -q

      # No --extra dev on purpose: this also proves the package works on runtime deps alone.
      - name: Puzzle rules still agree with the game's
        run: uv run --locked python -m connectris_pipeline.cli check
